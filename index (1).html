function render(){let q=QUESTIONS[index];$('count').textContent=`السؤال ${digits(index+1)} من ${digits(QUESTIONS.length)}`;$('category').textContent=q.category;$('progress').style.width=`${(index+1)/QUESTIONS.length*100}%`;$('question').textContent=q.question;$('options').innerHTML='';q.options.forEach((opt,i)=>{let l=document.createElement('label');l.className='option';let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=answers[index]===i;r.onchange=()=>answers[index]=i;l.append(r,document.createTextNode(opt));$('options').append(l)});$('prev').disabled=index===0;$('next').textContent=index===QUESTIONS.length-1?'تسليم الاختبار':'التالي'}
function updateTimer(){let s=Math.max(0,Math.ceil((endAt-Date.now())/1000));$('timer').textContent=`الوقت ${digits(Math.floor(s/60))}:${digits(String(s%60).padStart(2,'0'))}`;if(s===0)submit(true)}
$('startBtn').onclick=()=>{let name=$('name').value.trim(),klass=$('klass').value.trim();if(!name||!klass){alert('يرجى إدخال اسم الطالبة والصف');return}student={name,klass,studentId:$('studentId').value.trim()};index=0;answers=Array(20).fill(null);submitted=false;endAt=Date.now()+25*60*1000;show('exam');render();clearInterval(tick);tick=setInterval(updateTimer,1000);updateTimer()};
$('prev').onclick=()=>{if(index>0){index--;render()}};
$('next').onclick=()=>{if(index<19){index++;render()}else{let missing=answers.filter(x=>x===null).length;if(missing&&!confirm(`هناك ${missing} أسئلة بلا إجابة. هل تريدين التسليم؟`))return;submit(false)}};
async function submit(auto){if(submitted)return;submitted=true;clearInterval(tick);const cats=['الحساب','الجبر','الهندسة','البيانات'];let scores={};cats.forEach(c=>scores[c]=0);QUESTIONS.forEach((q,i)=>{if(answers[i]===q.answer)scores[q.category]++});let total=Object.values(scores).reduce((a,b)=>a+b,0);let rec={...student,date:new Date().toISOString(),total,...scores,answers:answers.map(x=>x===null?'':x+1).join('|'),timedOut:auto};let old=localResults();old.push(rec);try{localStorage.setItem(KEY,JSON.stringify(old))}catch{};show('result');$('resultName').textContent=`${student.name} | ${student.klass}`;$('score').textContent=`${digits(total)} / ٢٠ (${digits(Math.round(total/20*100))}٪)`;$('breakdown').innerHTML='';cats.forEach(c=>{let div=document.createElement('div');div.innerHTML=`<p><b>${c}</b> — ${digits(scores[c])} من ٥ (${digits(scores[c]*20)}٪)</p><div class="bar"><div style="width:${scores[c]*20}%"></div></div>`;$('breakdown').append(div)});$('saveStatus').textContent='تم حفظ النتيجة على هذا الجهاز.';refresh();if(SHEETS_WEB_APP_URL.startsWith('https://script.google.com/macros/s/')){try{await fetch(SHEETS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)});$('saveStatus').textContent='تم إرسال طلب حفظ النتيجة إلى Google Sheets. تحققي من الجدول لتأكيد وصولها.'}catch(e){$('saveStatus').textContent='حُفظت النتيجة محليًا، لكن تعذر إرسالها إلى Google Sheets.'}}}
$('restart').onclick=()=>{show('start');$('name').value='';$('studentId').value=''};
function refresh(){if(!$('teacherStats'))return;let data=localResults();if(!data.length){$('teacherStats').innerHTML='<p>لا توجد نتائج محفوظة على هذا الجهاز حتى الآن.</p>';return}let avg=key=>(data.reduce((s,r)=>s+(Number(r[key])||0),0)/data.length);let html=`<p>عدد المحاولات: <b>${digits(data.length)}</b> | متوسط الدرجة: <b>${digits(avg('total').toFixed(1))} / ٢٠</b></p><table class="results-table"><tr><th>المجال</th><th>متوسط الإتقان</th></tr>`;for(let c of ['الحساب','الجبر','الهندسة','البيانات'])html+=`<tr><td>${c}</td><td>${digits((avg(c)*20).toFixed(1))}٪</td></tr>`;html+='</table>';$('teacherStats').innerHTML=html}
if($('refresh'))$('refresh').onclick=refresh;
if($('clear'))$('clear').onclick=()=>{if(confirm('هل تريدين حذف جميع النتائج المحلية من هذا الجهاز؟')){localStorage.removeItem(KEY);refresh()}};
if($('export'))$('export').onclick=()=>{let data=localResults();if(!data.length){alert('لا توجد نتائج للتصدير');return}let fields=['date','name','klass','studentId','total','الحساب','الجبر','الهندسة','البيانات','answers','timedOut'];let labels=['التاريخ','اسم الطالبة','الصف','الرقم التعريفي','الدرجة من 20','الحساب من 5','الجبر من 5','الهندسة من 5','البيانات من 5','الإجابات','انتهى الوقت'];let csv=[labels,...data.map(r=>fields.map(k=>r[k]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='نتائج_القدرات_الكمي.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};refresh();
</script></body></html>
